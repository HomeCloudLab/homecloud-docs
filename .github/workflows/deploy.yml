name: Deploy docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HomeCloud CLI
        run: |
          set -euo pipefail
          CLI_URL="https://homecloud-cli.so.holab.abrdns.com/releases/latest/homecloud-linux-amd64"
          installed=0
          # SO download can flake (HTTP/2 INTERNAL_ERROR); retry + HTTP/1.1, then fall back.
          if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --http1.1 \
              "$CLI_URL" -o /tmp/homecloud; then
            chmod +x /tmp/homecloud
            if /tmp/homecloud version; then
              sudo mv /tmp/homecloud /usr/local/bin/homecloud
              installed=1
            fi
          fi
          if [ "$installed" -ne 1 ]; then
            echo "::warning::Published binary unavailable; installing CLI from GitHub + SDK from PyPI"
            python -m pip install --upgrade pip
            python -m pip install "homecloud-sdk>=0.5.6"
            python -m pip install "git+https://github.com/HomeCloudLab/homecloud-cli.git@master"
            homecloud version
          fi

      - name: Sync to SO bucket (docs.web)
        env:
          HOMECLOUD_ACCESS_KEY_ID: ${{ secrets.HOMECLOUD_ACCESS_KEY_ID }}
          HOMECLOUD_SECRET_ACCESS_KEY: ${{ secrets.HOMECLOUD_SECRET_ACCESS_KEY }}
          HOMECLOUD_APEX: ${{ secrets.HOMECLOUD_APEX }}
        run: |
          set -euo pipefail
          if [ -z "${HOMECLOUD_ACCESS_KEY_ID:-}" ] || [ -z "${HOMECLOUD_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Missing HOMECLOUD_ACCESS_KEY_ID or HOMECLOUD_SECRET_ACCESS_KEY repo secrets"
            exit 1
          fi
          # Fail the job if sync prints an auth/transport error (CLI may exit 0 on some failures).
          OUT="$(mktemp)"
          if ! homecloud so sync ./site so://docs/ --delete --output json 2>&1 | tee "$OUT"; then
            echo "::error::homecloud so sync failed"
            exit 1
          fi
          if grep -Eiq 'Invalid Access Key|UNAUTHORIZED|Not authenticated|AccessDenied|Forbidden' "$OUT"; then
            echo "::error::docs SO sync rejected credentials — update HOMECLOUD_* secrets on homecloud-docs"
            exit 1
          fi
          echo "Deployed → https://docs.web.${HOMECLOUD_APEX:-holab.abrdns.com}"
