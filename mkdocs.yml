site_name: HomeCloud Docs
site_url: https://docs.web.holab.abrdns.com
site_description: How to use HomeCloud — console, CLI, and SDK guides for account owners and DevOps

repo_name: HomeCloudLab/homecloud-docs
repo_url: https://github.com/HomeCloudLab/homecloud-docs
edit_uri: edit/main/docs/en/

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    scheme: console
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      # Keep false: reconfigure_material + navigation.instant emits a language-switcher
      # warning that fails `mkdocs build --strict`. We use a custom chrome/lang switch
      # and set dir/lang + localized theme strings from homecloud.js instead.
      reconfigure_material: false
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: he
          name: עברית
          build: true
          nav_translations:
            Home: בית
            Getting started: התחלה
            Guides: מדריכים
            CLI: CLI
            SDK: SDK
            Terraform: Terraform
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/overview.md
      - getting-started/accounts.md
      - getting-started/console.md
      - getting-started/access-keys.md
  - Guides:
      - guides/index.md
      - guides/object-storage.md
      - guides/queues.md
      - guides/databases.md
      - guides/compute.md
      - guides/regions.md
      - guides/redis.md
      - guides/functions.md
      - guides/applications.md
      - guides/kubernetes.md
      - guides/registry.md
      - guides/mail.md
      - guides/secrets.md
      - guides/iam.md
      - guides/domains.md
      - guides/ssl.md
      - guides/billing.md
      - guides/monitoring.md
      - guides/account.md
  - CLI:
      - cli/index.md
      - cli/install.md
      - cli/authentication.md
      - cli/commands/index.md
      - cli/commands/configure.md
      - cli/commands/login.md
      - cli/commands/so.md
      - cli/commands/mq.md
      - cli/commands/fn.md
      - cli/commands/ir.md
      - cli/commands/mail.md
      - cli/commands/billing.md
      - cli/releases.md
  - SDK:
      - sdk/index.md
      - sdk/python.md
      - sdk/nodejs.md
  - Terraform:
      - terraform/index.md

extra_css:
  - stylesheets/homecloud.css

extra_javascript:
  - javascripts/homecloud.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HomeCloudLab
